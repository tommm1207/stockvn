<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" fill="url(#bg)" rx="22"/>
  
  <g filter="url(#glow)">
    <!-- Candle 1 (Red/Down) -->
    <line x1="25" y1="85" x2="25" y2="55" stroke="#ff4757" stroke-width="3" stroke-linecap="round"/>
    <rect x="17" y="60" width="16" height="15" fill="#ff4757" rx="3"/>

    <!-- Candle 2 (Green/Up) -->
    <line x1="50" y1="70" x2="50" y2="35" stroke="#00d68f" stroke-width="3" stroke-linecap="round"/>
    <rect x="42" y="45" width="16" height="20" fill="#00d68f" rx="3"/>

    <!-- Candle 3 (Green/Up) -->
    <line x1="75" y1="50" x2="75" y2="15" stroke="#00d68f" stroke-width="3" stroke-linecap="round"/>
    <rect x="67" y="25" width="16" height="20" fill="#00d68f" rx="3"/>
  </g>
</svg>
